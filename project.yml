name: PopView
options:
  bundleIdPrefix: jp.popview
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  PopView:
    type: application
    platform: iOS
    sources:
      - path: PopView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.popview.app
        INFOPLIST_KEY_CFBundleDisplayName: PopView
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
