name: iOS Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build simulator target
        run: xcodebuild -project PopView.xcodeproj -scheme PopView -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build